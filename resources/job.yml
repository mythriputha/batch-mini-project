# Lakeflow Job / Databricks Asset Bundle resource definition
# Deploy with: databricks bundle deploy -t dev   (from the bundle root, alongside databricks.yml)
#
# This project's pipeline is a single notebook (src/01_batch_pipeline.py) that runs
# Bronze -> Silver (+Quarantine) -> Gold end to end, so this job has 2 real tasks:
# run the pipeline once, then run the SQL validation queries as a quality gate.
resources:
  jobs:
    batch_etl_job:
      name: batch-mini-project-etl
      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ../src/01_batch_pipeline
            base_parameters:
              catalog: "dbx_batch_mini_ws"
              schema: "batch_mini_project"
              volume: "landing"

        - task_key: quality_gate
          depends_on:
            - task_key: run_pipeline
          sql_task:
            file:
              path: ../sql/validation_scheduled.sql
            warehouse_id: "<sql-warehouse-id>"
          notification_settings:
            on_failure: ["puthamythri@gmail.com"]

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: "PAUSED"
